<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>World Cup 2026 Sweepstake</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>World Cup 2026 <span>Sweepstake</span></h1>
    <p class="tagline">Canada &middot; Mexico &middot; USA &bull; 11 Jun &ndash; 19 Jul 2026</p>
    <nav class="tabs">
      <button class="tab active" data-view="leaderboard">Leaderboard</button>
      <button class="tab" data-view="groups">Group Stage</button>
      <button class="tab" data-view="bracket">Knockout</button>
      <button class="tab" data-view="players">Players</button>
    </nav>
  </header>

  <div class="livebar">
    <span id="live-status" class="live-status">&hellip;</span>
    <button id="live-refresh" class="live-refresh" title="Fetch latest results">Refresh</button>
  </div>

  <main id="content"></main>

  <footer>
    <p>Results update automatically from TheSportsDB. You can also edit <code>data.js</code> by hand &mdash; see <code>README.md</code>.</p>
  </footer>

  <script src="data.js"></script>
  <script src="live.js"></script>
  <script src="app.js"></script>
</body>
</html>
