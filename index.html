<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>World Cup 2026 Sweepstake</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="locked">
  <!-- ===== Gate / login ===== -->
  <div id="gate" class="gate">
    <div class="sky"></div>
    <div class="cloud-bank left"></div>
    <div class="cloud-bank right"></div>
    <div class="gate-card">
      <div class="gate-trophy">FIFA World Cup 26</div>
      <p class="gate-kicker">Canada · Mexico · USA</p>
      <h1 class="gate-title">The <span>Sweepstake</span></h1>
      <p class="gate-sub">Enter your name to view the draw</p>
      <form id="gate-form" autocomplete="off">
        <input id="gate-input" type="text" placeholder="Your name…" aria-label="Your name" spellcheck="false" />
        <button type="submit" class="gate-go">Enter →</button>
      </form>
      <div class="gate-chips" id="gate-chips"></div>
      <p class="gate-error" id="gate-error"></p>
    </div>
  </div>
  <canvas id="confetti" class="confetti"></canvas>

  <!-- ===== Main site ===== -->
  <div id="site" class="site">
  <header>
    <h1>World Cup 2026 <span>Sweepstake</span></h1>
    <p class="tagline">Canada &middot; Mexico &middot; USA &bull; 11 Jun &ndash; 19 Jul 2026</p>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button class="tab active" data-view="leaderboard" role="tab" id="tab-leaderboard" aria-controls="content" aria-selected="true">Leaderboard</button>
      <button class="tab" data-view="groups" role="tab" id="tab-groups" aria-controls="content" aria-selected="false">Group Stage</button>
      <button class="tab" data-view="bracket" role="tab" id="tab-bracket" aria-controls="content" aria-selected="false">Knockout</button>
      <button class="tab" data-view="players" role="tab" id="tab-players" aria-controls="content" aria-selected="false">Players</button>
    </nav>
  </header>

  <div class="livebar">
    <span id="whoami" class="whoami"></span>
    <span class="livebar-spacer"></span>
    <span id="live-status" class="live-status">&hellip;</span>
    <button id="live-refresh" class="live-refresh" title="Fetch latest results">Refresh</button>
  </div>

  <main id="content" role="tabpanel" tabindex="0" aria-labelledby="tab-leaderboard"></main>
  </div><!-- /#site -->

  <script src="data.js"></script>
  <script src="thirds.js"></script>
  <script src="engine.js"></script>
  <script src="live.js"></script>
  <script src="app.js"></script>
</body>
</html>
